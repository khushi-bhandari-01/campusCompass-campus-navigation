# Optional Render Blueprint: Render dashboard > New > Blueprint > pick this repo.
services:
  - type: web
    name: pathfinder-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        sync: false   # you enter your Vercel URL in the Render dashboard
